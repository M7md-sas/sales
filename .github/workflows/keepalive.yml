# Keeps the free Supabase project from pausing after a week with no requests
# (a shop closed for Eid). Needs NO setup: it reads the project URL and the
# public anon key from app/js/config.js, which is already in this repository.
#
# It also keeps itself alive: GitHub switches off scheduled workflows in a
# repository with no commits for 60 days, so when the last commit is older
# than 45 days it commits a one-line heartbeat file.
#
# If the ping fails (project already paused, wrong key), the run turns red and
# GitHub e-mails the repository owner.
name: keep-supabase-awake
on:
  schedule:
    - cron: '17 6 */3 * *'   # every 3 days, 09:17 Riyadh
  # Also runs by itself on the first push and whenever config.js changes, so
  # nobody has to press "Run workflow" to find out whether it works.
  push:
    branches: [main]
    paths: ['app/js/config.js', '.github/workflows/keepalive.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Ping Supabase
        run: |
          url=$(grep -oP "SUPABASE_URL:.*?:\s*'\K[^']+" app/js/config.js | head -1)
          key=$(grep -oP "SUPABASE_ANON_KEY:.*?:\s*'\K[^']+" app/js/config.js | head -1)
          if [ -z "$url" ] || echo "$url$key" | grep -q 'YOUR-'; then
            # Not deployed yet: nothing to keep awake, and no reason to e-mail
            # anyone. The push trigger runs this again once config.js is filled.
            echo "::warning::app/js/config.js still holds placeholder values — skipping."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "apikey: $key" "$url/rest/v1/settings?select=key&limit=1")
          echo "Supabase answered HTTP $code"
          # 401/403 is the expected answer: anon may read nothing. It still
          # counts as activity. Anything else means trouble.
          case "$code" in 2*|401|403) ;; *) echo "Unexpected answer — is the project paused?"; exit 1 ;; esac

      - name: Keep this schedule alive
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 45 ]; then
            date -u +%F > .github/heartbeat.txt
            git config user.name  "keepalive"
            git config user.email "keepalive@users.noreply.github.com"
            git add .github/heartbeat.txt
            git commit -m "keepalive heartbeat"
            git push
          else
            echo "Repository active recently — nothing to commit."
          fi
